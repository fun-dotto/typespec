name: Distribute YAML

on:
  workflow_dispatch:

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: jdx/mise-action@v4
        with:
          github_token: ${{ github.token }}
          cache: true
      - name: Setup
        run: mise run setup
      - name: Compile
        run: mise run compile
      - uses: actions/upload-artifact@v4
        with:
          name: schemas
          path: tsp-output/schema/

  create-pr:
    needs: compile
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: app
            mappings:
              - source: tsp-output/schema/openapi.AppBFFService.yaml
                target: openapi/openapi.yaml
          - repo: web
            mappings:
              - source: tsp-output/schema/openapi.AppBFFService.yaml
                target: openapi/openapi.yaml
          - repo: admin-web
            mappings:
              - source: tsp-output/schema/openapi.AdminBFFService.yaml
                target: openapi/openapi.yaml
          - repo: server
            mappings:
              - source: tsp-output/schema/openapi.AcademicService.yaml
                target: api/openapi/academic/openapi.yaml
              - source: tsp-output/schema/openapi.AdminBFFService.yaml
                target: api/openapi/admin/openapi.yaml
              - source: tsp-output/schema/openapi.AnnouncementService.yaml
                target: api/openapi/announcement/openapi.yaml
              - source: tsp-output/schema/openapi.AppBFFService.yaml
                target: api/openapi/app/openapi.yaml
              - source: tsp-output/schema/openapi.FunchService.yaml
                target: api/openapi/funch/openapi.yaml
              - source: tsp-output/schema/openapi.UserService.yaml
                target: api/openapi/user/openapi.yaml
    steps:
      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ vars.DOTTO_API_SCHEMA_UPDATER_APP_ID }}
          private-key: ${{ secrets.DOTTO_API_SCHEMA_UPDATER_APP_PRIVATE_KEY }}
          owner: fun-dotto
          repositories: ${{ matrix.repo }}
      - uses: actions/download-artifact@v4
        with:
          name: schemas
          path: tsp-output/schema
      - name: Check if branch and PR exist
        id: check-existing
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Check if branch exists
          exit_code=0
          git ls-remote --exit-code --heads https://x-access-token:${GH_TOKEN}@github.com/fun-dotto/${{ matrix.repo }}.git update-openapi-schema || exit_code=$?

          if [ $exit_code -eq 0 ]; then
            echo "branch_exists=true" >> $GITHUB_OUTPUT
          else
            echo "branch_exists=false" >> $GITHUB_OUTPUT
          fi

          # Check if PR exists
          pr_count=$(gh pr list --repo fun-dotto/${{ matrix.repo }} --head update-openapi-schema --base main --state open --json number --jq 'length')
          if [ "$pr_count" -gt 0 ]; then
            echo "pr_exists=true" >> $GITHUB_OUTPUT
          else
            echo "pr_exists=false" >> $GITHUB_OUTPUT
          fi
      - uses: actions/checkout@v6
        with:
          repository: fun-dotto/${{ matrix.repo }}
          token: ${{ steps.app-token.outputs.token }}
          path: target-repo
          ref: ${{ steps.check-existing.outputs.branch_exists == 'true' &&
            steps.check-existing.outputs.pr_exists == 'true' &&
            'update-openapi-schema' || '' }}
      - name: Copy schemas
        env:
          MAPPINGS: ${{ toJson(matrix.mappings) }}
        run: |
          echo "$MAPPINGS" | jq -c '.[]' | while read -r mapping; do
            source_path=$(echo "$mapping" | jq -r '.source')
            target_path=$(echo "$mapping" | jq -r '.target')

            if [ ! -f "$source_path" ]; then
              echo "Error: source schema not found: $source_path"
              exit 1
            fi

            mkdir -p "target-repo/$(dirname "$target_path")"
            cp "$source_path" "target-repo/$target_path"
          done
      - name: Push to existing branch
        if: steps.check-existing.outputs.branch_exists == 'true' &&
          steps.check-existing.outputs.pr_exists == 'true'
        working-directory: target-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update OpenAPI schema from dotto-typespec"
            git push
          fi
      - uses: peter-evans/create-pull-request@v7
        if: steps.check-existing.outputs.branch_exists != 'true' ||
          steps.check-existing.outputs.pr_exists != 'true'
        with:
          token: ${{ steps.app-token.outputs.token }}
          path: target-repo
          branch: update-openapi-schema
          draft: true
          title: "Update OpenAPI schema"
          body: |
            This PR updates the OpenAPI schema from [dotto-typespec](https://github.com/fun-dotto/dotto-typespec).

            Triggered by: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          commit-message: "Update OpenAPI schema from dotto-typespec"
