[settings]
minimum_release_age = "7d"

[tools]
node = "26.10.0"
pnpm = "12.8.1"
"npm:rulesync" = "24.0.0"

[tasks.bootstrap]
run = [
  { task = "rulesync" },
  "pnpm install",
]

[tasks.rulesync]
run = "rulesync generate"

[tasks.compile]
run = "pnpm compile"

[tasks.watch]
run = "pnpm watch"

[tasks.format]
run = "pnpm format"

[tasks.preview]
run = "pnpm preview"

[tasks.watch-and-preview]
depends = ["watch", "preview"]

[tasks.clean]
run = "rm -rf ./tsp-output/schema"
